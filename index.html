<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass - 3D Logo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #444;
            pointer-events: none;
            letter-spacing: 1px;
            font-size: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="info">Glass Prototype</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.z = 350;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x006cff,
            metalness: 0.1,
            roughness: 0.15,
            transmission: 1.0,
            ior: 1.33,
            thickness: 5.0,
            clearcoat: 1.0,
            clearcoatRoughness: 0.0,
            transparent: true,
            opacity: 1.0,
            side: THREE.DoubleSide
        });

        const logoGroup = new THREE.Group();
        scene.add(logoGroup);

        const logoSVG = `<?xml version="1.0" encoding="UTF-8"?>

        const loader = new SVGLoader();
        const svgData = loader.parse(logoSVG);

        // Compute overall bounding box across all shapes to center the whole logo
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        svgData.paths.forEach((path) => {
            const shapes = SVGLoader.createShapes(path);
            shapes.forEach((shape) => {
                const pts = shape.getPoints();
                pts.forEach(p => {
                    minX = Math.min(minX, p.x);
                    maxX = Math.max(maxX, p.x);
                    minY = Math.min(minY, p.y);
                    maxY = Math.max(maxY, p.y);
                });
            });
        });

        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;

        svgData.paths.forEach((path) => {
            const shapes = SVGLoader.createShapes(path);
            shapes.forEach((shape) => {
                const geometry = new THREE.ExtrudeGeometry(shape, {
                    depth: 8,
                    bevelEnabled: true,
                    bevelThickness: 1.5,
                    bevelSize: 0.8,
                    bevelSegments: 3
                });

                geometry.translate(-centerX, -centerY, 0);

                const mesh = new THREE.Mesh(geometry, glassMaterial);
                // SVG Y-axis is flipped relative to 3D space
                mesh.rotation.x = Math.PI;
                logoGroup.add(mesh);
            });
        });

        // Mouse tilt interaction
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            mouseY = (event.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            logoGroup.rotation.y += 0.05 * (mouseX * 0.5 - logoGroup.rotation.y);
            logoGroup.rotation.x += 0.05 * (mouseY * 0.5 - logoGroup.rotation.x);
            logoGroup.position.y = Math.sin(Date.now() * 0.001) * 3;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
